name: Native plug-in

# Whenever the native plug-in's source changes, build Retooled.XeSS.Native.dll and commit it to the branch that changed.

on:
  push:
    branches: ['**']
    paths:
      - 'Native~/CMakeLists.txt'
      - 'Native~/src/**'
      - 'Native~/unity/**'
      - 'Native~/build.ps1'
      - 'Native~/fetch-sdk.ps1'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces an older run, so the binary always comes from the newest source.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # The plug-in only needs the Vulkan headers, so it builds against Khronos' header repository instead of the SDK.
  VULKAN_HEADERS: v1.4.363

jobs:
  build:
    name: Build
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Puts the Windows SDK, and the CMake and Ninja that come with Visual Studio, on the path for clang-cl.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get the XeSS SDK headers and the Vulkan headers
        run: |
          Native~/fetch-sdk.ps1
          git clone --quiet --depth 1 --branch $env:VULKAN_HEADERS https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP/vulkan-headers"

      - name: Build
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          Native~/build.ps1 -VulkanInclude "$env:RUNNER_TEMP/vulkan-headers/include"

      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: Plugins/x86_64/Retooled.XeSS.Native.dll
          retention-days: 7

  commit:
    needs: build
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    uses: KSP1Retooled/upm/.github/workflows/commit-binaries.yml@main
    with:
      artifacts: native
      path: Plugins/x86_64
